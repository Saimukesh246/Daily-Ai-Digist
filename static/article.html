<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{OG_TITLE}}</title>
    <meta name="description" content="{{OG_DESCRIPTION}}">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="AI Digest">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/blog.css?v=3">

    <script>
    (function () {
        var saved = localStorage.getItem("aidigest_blog_theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-font-size", localStorage.getItem("aidigest_blog_font_size") || "md");
    })();
    </script>
</head>
<body>

    <header class="article-header">
        <div class="article-header-inner">
            <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to AI Digest</a>
            <div class="article-header-right">
                <div class="article-wordmark">AI Digest</div>
                <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
                <button class="icon-btn" id="settings-toggle-btn" aria-label="Settings" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Settings Slide-out Drawer -->
    <div class="saved-drawer-backdrop" id="settings-drawer-backdrop" hidden></div>
    <aside class="saved-drawer" id="settings-drawer" hidden>
        <div class="saved-drawer-head">
            <h3><i class="fa-solid fa-gear"></i> Settings</h3>
            <button class="drawer-close-btn" id="settings-close-btn" aria-label="Close settings">&times;</button>
        </div>
        <div class="saved-drawer-body">
            <div class="settings-group">
                <div class="settings-label">Appearance</div>
                <div class="segmented-control" id="settings-theme-control">
                    <button class="segmented-btn" data-theme-choice="light">Light</button>
                    <button class="segmented-btn" data-theme-choice="dark">Dark</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">Text Size</div>
                <div class="segmented-control" id="settings-fontsize-control">
                    <button class="segmented-btn segmented-btn-sm" data-fontsize-choice="sm">A</button>
                    <button class="segmented-btn segmented-btn-md" data-fontsize-choice="md">A</button>
                    <button class="segmented-btn segmented-btn-lg" data-fontsize-choice="lg">A</button>
                </div>
            </div>
        </div>
    </aside>

    <main class="article-main">
        <div id="state-loading" class="state-msg">Loading article…</div>
        <div id="state-error" class="state-msg" hidden>Couldn't find that article.</div>

        <article id="article-content" hidden>
            <div class="article-kicker" id="article-kicker"></div>
            <h1 class="article-headline" id="article-headline"></h1>
            <div class="article-dek" id="article-dek"></div>
            <div class="article-meta" id="article-meta"></div>

            <div class="thumb article-hero" id="article-hero"></div>

            <div class="article-body" id="article-body"></div>

            <div class="article-share" id="article-share" hidden>
                <span class="article-share-label">Share</span>
                <a class="article-share-btn" id="share-x" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on X"><i class="fa-brands fa-x-twitter"></i></a>
                <a class="article-share-btn" id="share-facebook" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a class="article-share-btn" id="share-linkedin" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <button class="article-share-btn" id="share-copy" type="button" aria-label="Copy link" title="Copy link"><i class="fa-solid fa-link"></i></button>
            </div>

            <div class="article-source" id="article-source" hidden>
                <a id="article-source-link" href="#" target="_blank" rel="noopener noreferrer">Read the original source <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </div>
        </article>

        <div class="related-section" id="related-section" hidden>
            <div class="related-heading">More from AI Digest</div>
            <div class="research-grid" id="related-grid"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="page-inner footer-inner">
            <div>&copy; <span id="footer-year"></span> AI Digest. Autonomous intelligence briefing.</div>
        </div>
    </footer>

    <script src="/static/js/article.js?v=3"></script>
</body>
</html>
